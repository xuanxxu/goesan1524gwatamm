<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 학교 생태지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9efe6;
    --ink: #1f3328;
    --ink-soft: #4b6354;
    --leaf: #3f7d4e;
    --sun: #f2c14e;
    --panel: #fbfdf9;
    --line: #c5d3c4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Gowun Dodum", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    line-height: 1.6;
  }
  header { max-width: 960px; margin: 0 auto; padding: 28px 20px 12px; }
  h1 { margin: 0 0 4px; font-size: clamp(1.6rem, 4vw, 2.2rem); }
  header p { margin: 0; color: var(--ink-soft); }

  main { max-width: 960px; margin: 0 auto; padding: 8px 20px 40px; }

  /* 지도 영역 */
  .map {
    position: relative;
    width: 100%;
    border: 2px solid var(--ink);
    border-radius: 10px;
    overflow: hidden;
    background: #cfe0c8;
    aspect-ratio: 16 / 10;           /* 지도 이미지 비율에 맞게 바꾸세요 */
  }
  .map img.base { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; }
  .map .fallback {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; text-align: center;
    color: var(--ink-soft); padding: 20px;
    background:
      repeating-linear-gradient(0deg, transparent 0 39px, rgba(31,51,40,.08) 39px 40px),
      repeating-linear-gradient(90deg, transparent 0 39px, rgba(31,51,40,.08) 39px 40px),
      #cfe0c8;
  }

  /* 이모티콘 마커 */
  .marker {
    position: absolute;
    transform: translate(-50%, -50%);
    font-size: clamp(22px, 4.5vw, 38px);
    line-height: 1;
    background: rgba(255,255,255,.85);
    border: 2px solid var(--leaf);
    border-radius: 50%;
    width: 1.55em; height: 1.55em;
    display: grid; place-items: center;
    cursor: pointer;
    padding: 0;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .marker:hover, .marker:focus-visible {
    transform: translate(-50%, -50%) scale(1.18);
    box-shadow: 0 0 0 4px var(--sun);
    outline: none;
  }

  .legend { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
  .legend button {
    font: inherit; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 12px; color: var(--ink);
  }
  .legend button:hover, .legend button:focus-visible { border-color: var(--leaf); outline: 2px solid var(--sun); }
  .hint { margin-top: 10px; font-size: .9rem; color: var(--ink-soft); }

  /* 팝업 */
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(20, 35, 27, .55);
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .overlay.open { display: flex; }
  .card {
    width: min(460px, 100%); max-height: 90vh; overflow: auto;
    background: var(--panel); border-radius: 12px;
    border: 2px solid var(--ink);
    animation: pop .18s ease-out;
  }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } .marker { transition: none; } }
  .card .photo { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #dbe6d8; display: block; }
  .card .body { padding: 16px 18px 18px; }
  .card h2 { margin: 0 0 2px; font-size: 1.4rem; }
  .card .sci { margin: 0 0 10px; color: var(--ink-soft); font-size: .9rem; }
  .card ul { margin: 0; padding-left: 1.2em; }
  .card li { margin-bottom: 4px; }
  .card .where { margin-top: 10px; font-size: .9rem; color: var(--ink-soft); }
  .close {
    margin-top: 14px; font: inherit; cursor: pointer;
    background: var(--ink); color: #fff; border: 0; border-radius: 8px; padding: 8px 18px;
  }
  .close:focus-visible { outline: 3px solid var(--sun); }

  /* 좌표 찾기 모드 (주소 뒤에 ?edit 를 붙이면 켜져요) */
  .coord-toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 8px 16px; border-radius: 8px;
    display: none; z-index: 20;
  }
</style>
</head>
<body>

<header>
  <h1>우리 학교 생태지도</h1>
  <p>지도 위의 이모티콘을 눌러 학교에서 만난 생물을 살펴보세요.</p>
</header>

<main>
  <div class="map" id="map">
    <!-- 학교 지도 이미지를 이 이름으로 저장하세요: images/school-map.png -->
    <img class="base" src="images/school-map.png" alt="우리 학교 지도" id="baseImg">
    <div class="fallback" id="fallback">
      images/school-map.png 파일이 아직 없어요.<br>학교 지도 이미지를 올리면 여기에 나타나요.
    </div>
  </div>

  <div class="legend" id="legend" aria-label="생물 목록"></div>
  <p class="hint" id="hint">이모티콘이나 아래 목록의 이름을 누르면 자세한 설명이 나와요.</p>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="popTitle">
  <div class="card">
    <img class="photo" id="popPhoto" alt="">
    <div class="body">
      <h2 id="popTitle"></h2>
      <p class="sci" id="popSci"></p>
      <ul id="popTraits"></ul>
      <p class="where" id="popWhere"></p>
      <button class="close" id="popClose">닫기</button>
    </div>
  </div>
</div>

<div class="coord-toast" id="toast"></div>

<script>
/* ============================================================
   ★ 여기만 고치면 돼요 ★
   x, y : 지도 위 위치 (%) — 왼쪽 위가 0,0 / 오른쪽 아래가 100,100
          주소 끝에 ?edit 를 붙여서 열고 지도를 클릭하면 좌표가 나와요.
   photo: images 폴더에 넣은 사진 파일 이름
   ============================================================ */
const SPECIES = [
  {
    emoji: "🌲",
    name: "소나무",
    sci: "Pinus densiflora",
    x: 22, y: 30,
    photo: "images/pine.jpg",
    traits: [
      "사계절 잎이 푸른 늘푸른바늘잎나무예요.",
      "바늘 모양 잎이 2개씩 모여 나요.",
      "봄에 꽃가루가 날리고, 솔방울에 씨앗이 들어 있어요."
    ],
    where: "발견한 곳: 운동장 옆 화단"
  },
  {
    emoji: "🌿",
    name: "쑥",
    sci: "Artemisia princeps",
    x: 58, y: 62,
    photo: "images/mugwort.jpg",
    traits: [
      "잎 뒷면에 흰 솜털이 있어서 은빛으로 보여요.",
      "특유의 향이 나고, 쑥떡이나 쑥국으로 먹어요.",
      "길가나 빈터에서 흔히 자라는 여러해살이풀이에요."
    ],
    where: "발견한 곳: 후문 근처 풀밭"
  },
  {
    emoji: "🌸",
    name: "벚나무",
    sci: "Prunus serrulata",
    x: 76, y: 28,
    photo: "images/cherry.jpg",
    traits: [
      "봄에 잎보다 먼저 꽃이 피어요.",
      "꽃잎은 5장이고 연분홍색이에요.",
      "여름에는 버찌라는 열매가 열려요."
    ],
    where: "발견한 곳: 정문에서 본관 가는 길"
  }
  /* 생물을 더 넣으려면 위 { ... } 덩어리를 복사해서 쉼표(,)로 이어 붙이세요. */
];
/* ============================================================ */

const map = document.getElementById("map");
const legend = document.getElementById("legend");
const overlay = document.getElementById("overlay");
const popPhoto = document.getElementById("popPhoto");
const popTitle = document.getElementById("popTitle");
const popSci = document.getElementById("popSci");
const popTraits = document.getElementById("popTraits");
const popWhere = document.getElementById("popWhere");
const popClose = document.getElementById("popClose");
let lastFocus = null;

// 지도 이미지가 없을 때 안내 표시
document.getElementById("baseImg").addEventListener("error", function () {
  this.style.display = "none";
  document.getElementById("fallback").style.display = "flex";
});

function openPopup(s) {
  lastFocus = document.activeElement;
  popPhoto.src = s.photo;
  popPhoto.alt = s.name + " 사진";
  popPhoto.onerror = function () { this.removeAttribute("src"); };
  popTitle.textContent = s.emoji + " " + s.name;
  popSci.textContent = s.sci || "";
  popTraits.innerHTML = "";
  s.traits.forEach(function (t) {
    const li = document.createElement("li");
    li.textContent = t;
    popTraits.appendChild(li);
  });
  popWhere.textContent = s.where || "";
  overlay.classList.add("open");
  popClose.focus();
}

function closePopup() {
  overlay.classList.remove("open");
  if (lastFocus) lastFocus.focus();
}

SPECIES.forEach(function (s) {
  // 지도 위 마커
  const m = document.createElement("button");
  m.className = "marker";
  m.type = "button";
  m.style.left = s.x + "%";
  m.style.top = s.y + "%";
  m.textContent = s.emoji;
  m.setAttribute("aria-label", s.name + " 자세히 보기");
  m.addEventListener("click", function (e) { e.stopPropagation(); openPopup(s); });
  map.appendChild(m);

  // 아래 목록 버튼
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = s.emoji + " " + s.name;
  b.addEventListener("click", function () { openPopup(s); });
  legend.appendChild(b);
});

popClose.addEventListener("click", closePopup);
overlay.addEventListener("click", function (e) { if (e.target === overlay) closePopup(); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closePopup(); });

// 좌표 찾기 모드: 주소 뒤에 ?edit
if (location.search.indexOf("edit") !== -1) {
  const toast = document.getElementById("toast");
  document.getElementById("hint").textContent = "좌표 찾기 모드: 지도를 클릭하면 x, y 값이 아래에 나와요.";
  map.addEventListener("click", function (e) {
    const r = map.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width * 100).toFixed(0);
    const y = ((e.clientY - r.top) / r.height * 100).toFixed(0);
    toast.textContent = "x: " + x + ", y: " + y;
    toast.style.display = "block";
  });
}
</script>
</body>
</html>
